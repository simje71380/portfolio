<div class="--section">
  <div *ngFor="let project of projects">
    <div class="card">
      <a [href]="project.github">
        <img
          class="thumbnail"
          [src]="project.thumbnail"
          alt="project thumbnail"
        />
      </a>
      <h2 class="--h2 margin0">{{ project.name }}</h2>
      <p class="--p2 margin0">{{ project.dates }}</p>
      <p class="--p1 margin0">{{ project.desc }}</p>
      <div class="skills-container">
        <img
          *ngFor="let skill of project.icons"
          [src]="skill"
          alt="skill icon"
          class="skill-icon"
        />
      </div>
      <a [href]="project.github" class="github-btn-container">
        <div>
          <img [src]="getIcon('github.png')" alt="github" />
          <p>GitHub</p>
        </div>
      </a>
    </div>
  </div>
</div>
